name: 拉取 xmlgz

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16,22,4,10 * * *'   # UTC 16/22/4/10 = 上海 0/6/12/18 点

concurrency:
  group: sync-xmlgz
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write
    steps:
      - name: Checkout 我的仓库
        uses: actions/checkout@v4

      - name: 下载所有 xml.gz 文件
        run: |
          set -e
          API="https://api.github.com/repos/kuke31/xmlgz/contents/"
          RAW="https://raw.githubusercontent.com/kuke31/xmlgz/main"

          # 先删除本地旧的 xml.gz，避免残留已删除的文件
          rm -f ./*.xml.gz

          # 列出仓库根目录所有 .xml.gz 文件名
          files=$(curl -fsSL "$API" | jq -r '.[].name | select(endswith(".xml.gz"))')

          if [ -z "$files" ]; then
            echo "仓库里没有找到 .xml.gz 文件"
            exit 1
          fi

          echo "发现以下文件："
          echo "$files"

          while read -r f; do
            [ -z "$f" ] && continue
            echo "Downloading $f"
            curl -fL -o "$f" "$RAW/$f" || echo "跳过失败: $f"
          done <<< "$files"

          echo "下载完成，当前目录："
          ls -lh ./*.xml.gz

      - name: 更新 README 时间
        run: |
          NOW=$(date '+%Y-%m-%d %H:%M:%S')
          sed -i "s|<!-- LAST_SYNC -->.*|<!-- LAST_SYNC -->$NOW|" README.md

      - name: 提交
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A '*.xml.gz' README.md
          git diff --cached --quiet || git commit -m "sync xml.gz files"
          git push